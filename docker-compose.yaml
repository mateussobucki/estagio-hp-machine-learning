services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    env_file: ./app/.env
    volumes:
      - ./app:/app
    command: uv run --no-dev uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app